[project]
name = "minescript-robot"
version = "0.1.0"
description = "MineScript Robot IDE: interpreter, robot simulator and IDE"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Naming rules (N) are left off on purpose: the project mandates camelCase variables.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
